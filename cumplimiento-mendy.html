<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cumplimiento sanitario – Mendy Fast Food</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF6B35;
  --dark:    #1B2432;
  --mid:     #2C3A50;
  --green:   #22C55E;
  --yellow:  #F59E0B;
  --red:     #EF4444;
  --blue:    #00B4D8;
  --accent:  #FFD166;
  --muted:   #6B7280;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Nunito',sans-serif;
  background:var(--dark);
  min-height:100vh;
  color:#fff;
}

/* ══ LOGIN ══ */
#screen-login {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(145deg,#1B2432,#2C3A50);
}
.login-card {
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  padding:36px 28px;
  width:100%;
  max-width:380px;
  text-align:center;
}
.login-logo { font-size:3rem; margin-bottom:12px; }
.login-title { font-family:'Syne',sans-serif; font-size:1.6rem; font-weight:800; margin-bottom:4px; }
.login-title span { color:var(--primary); }
.login-sub { color:rgba(255,255,255,.45); font-size:.85rem; margin-bottom:28px; }
.user-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.user-btn {
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:14px 10px;
  cursor:pointer;
  color:#fff;
  font-family:'Nunito',sans-serif;
  transition:.2s;
}
.user-btn:hover { border-color:var(--primary); background:rgba(255,107,53,.12); }
.user-btn.selected { border-color:var(--primary); background:rgba(255,107,53,.18); }
.user-btn .u-avatar { font-size:1.8rem; margin-bottom:6px; }
.user-btn .u-name { font-size:.82rem; font-weight:700; }
.user-btn .u-role { font-size:.7rem; color:rgba(255,255,255,.45); margin-top:2px; }
.pin-label { color:rgba(255,255,255,.6); font-size:.82rem; margin-bottom:8px; text-align:left; }
.pin-input {
  width:100%;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.15);
  border-radius:12px;
  padding:13px 16px;
  color:#fff;
  font-size:1.4rem;
  letter-spacing:6px;
  text-align:center;
  font-family:'Syne',sans-serif;
  outline:none;
  margin-bottom:14px;
  transition:.2s;
}
.pin-input:focus { border-color:var(--primary); }
.btn-login {
  width:100%;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:14px;
  font-family:'Syne',sans-serif;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
.btn-login:hover { background:#e85a25; }
.login-error { color:var(--red); font-size:.8rem; margin-top:8px; min-height:18px; }

/* ══ APP ══ */
#screen-app { display:none; min-height:100vh; }
.top-nav {
  background:var(--mid);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;
  top:0;
  z-index:100;
}
.nav-brand { font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; }
.nav-brand span { color:var(--primary); }
.nav-user { display:flex; align-items:center; gap:8px; font-size:.82rem; color:rgba(255,255,255,.65); }
.btn-logout {
  background:rgba(255,255,255,.08);
  border:none;
  border-radius:8px;
  padding:6px 12px;
  color:rgba(255,255,255,.6);
  cursor:pointer;
  font-size:.78rem;
  font-family:'Nunito',sans-serif;
}
.btn-logout:hover { background:rgba(255,255,255,.15); color:#fff; }

.tabs {
  display:flex;
  background:var(--mid);
  padding:0 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
  overflow-x:auto;
  gap:0;
}
.tab-btn {
  background:none;
  border:none;
  border-bottom:3px solid transparent;
  padding:13px 16px;
  color:rgba(255,255,255,.5);
  font-family:'Nunito',sans-serif;
  font-size:.84rem;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:.2s;
}
.tab-btn.active { color:#fff; border-bottom-color:var(--primary); }

.tab-content { display:none; padding:20px; max-width:860px; margin:0 auto; }
.tab-content.active { display:block; }

/* ══ CARDS ══ */
.section-title {
  font-family:'Syne',sans-serif;
  font-size:1rem;
  color:var(--accent);
  margin-bottom:14px;
}

.equipo-card {
  background:rgba(255,255,255,.06);
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:14px;
  border-left:4px solid var(--green);
  transition:.2s;
}
.equipo-card.warn  { border-left-color:var(--yellow); }
.equipo-card.alert { border-left-color:var(--red); }

.eq-icon { font-size:2rem; flex-shrink:0; }
.eq-info { flex:1; }
.eq-name { font-weight:700; font-size:.92rem; }
.eq-area { font-size:.75rem; color:rgba(255,255,255,.45); margin-top:2px; }
.eq-resp { font-size:.75rem; color:rgba(255,255,255,.45); margin-top:2px; }

.eq-status-select {
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:6px 10px;
  color:#fff;
  font-family:'Nunito',sans-serif;
  font-size:.78rem;
  outline:none;
  cursor:pointer;
}

.semaforo {
  width:11px; height:11px;
  border-radius:50%;
  flex-shrink:0;
}
.sem-ok    { background:var(--green); }
.sem-warn  { background:var(--yellow); }
.sem-alert { background:var(--red); box-shadow:0 0 6px rgba(239,68,68,.7); }

/* ══ CHECKLIST ══ */
.checklist-header {
  background:rgba(255,255,255,.06);
  border-radius:16px;
  padding:16px 20px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}
.checklist-header h3 { font-family:'Syne',sans-serif; font-size:1rem; }
.checklist-header p  { font-size:.8rem; color:rgba(255,255,255,.45); margin-top:2px; }

.progress-bar-wrap {
  background:rgba(255,255,255,.1);
  border-radius:99px;
  height:8px;
  overflow:hidden;
  flex:1;
  min-width:100px;
}
.progress-bar-fill {
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  transition:.4s;
}

.turno-tabs {
  display:flex;
  gap:8px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.turno-chip {
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:6px 16px;
  font-size:.78rem;
  font-weight:700;
  color:rgba(255,255,255,.6);
  cursor:pointer;
  transition:.2s;
}
.turno-chip.active { background:var(--primary); border-color:var(--primary); color:#fff; }

.check-item {
  background:rgba(255,255,255,.04);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:14px;
  transition:.2s;
  border:1.5px solid rgba(255,255,255,.06);
}
.check-item.done {
  background:rgba(34,197,94,.08);
  border-color:rgba(34,197,94,.2);
}
.check-item.done .ci-name { text-decoration:line-through; color:rgba(255,255,255,.4); }

.check-box {
  width:26px; height:26px;
  border-radius:8px;
  border:2px solid rgba(255,255,255,.2);
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:.2s;
  font-size:1rem;
}
.check-box.checked { background:var(--green); border-color:var(--green); }

.ci-info { flex:1; }
.ci-name { font-size:.88rem; font-weight:600; transition:.2s; }
.ci-area { font-size:.73rem; color:rgba(255,255,255,.4); margin-top:2px; }
.ci-freq { font-size:.7rem; color:rgba(255,255,255,.35); margin-top:1px; }
.ci-producto { font-size:.72rem; color:var(--blue); margin-top:2px; }

.btn-save-check {
  width:100%;
  background:var(--green);
  color:#fff;
  border:none;
  border-radius:14px;
  padding:16px;
  font-family:'Syne',sans-serif;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  margin-top:16px;
  transition:.2s;
}
.btn-save-check:hover { background:#16a34a; }

/* ══ HISTORIAL ══ */
.hist-row {
  background:rgba(255,255,255,.04);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.hist-row .hr-name { font-weight:700; font-size:.88rem; }
.hist-row .hr-meta { font-size:.75rem; color:rgba(255,255,255,.4); margin-top:2px; }
.badge-pct {
  padding:3px 12px;
  border-radius:20px;
  font-size:.75rem;
  font-weight:700;
  flex-shrink:0;
}

/* ══ KPI ══ */
.kpi-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;
  margin-bottom:20px;
}
.kpi-card {
  background:rgba(255,255,255,.07);
  border-radius:16px;
  padding:16px;
  text-align:center;
}
.kpi-num { font-family:'Syne',sans-serif; font-size:2rem; font-weight:800; margin-bottom:4px; }
.kpi-label { font-size:.73rem; color:rgba(255,255,255,.5); }

/* ══ FORM ══ */
.form-card {
  background:rgba(255,255,255,.06);
  border-radius:18px;
  padding:22px;
  margin-bottom:16px;
}
.form-card h3 { font-family:'Syne',sans-serif; font-size:1rem; margin-bottom:16px; color:var(--accent); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.form-group { display:flex; flex-direction:column; gap:5px; }
.form-label { font-size:.78rem; color:rgba(255,255,255,.55); font-weight:600; }
.form-input, .form-select {
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:10px 12px;
  color:#fff;
  font-family:'Nunito',sans-serif;
  font-size:.88rem;
  outline:none;
  transition:.2s;
}
.form-input:focus, .form-select:focus { border-color:var(--primary); }
.form-select option { background:#2C3A50; }
.btn-primary {
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:11px 22px;
  font-family:'Syne',sans-serif;
  font-size:.88rem;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
.btn-primary:hover { background:#e85a25; }
.btn-del {
  background:rgba(239,68,68,.15);
  border:none;
  border-radius:8px;
  padding:6px 12px;
  color:var(--red);
  font-size:.75rem;
  cursor:pointer;
  font-family:'Nunito',sans-serif;
  font-weight:700;
}

/* ══ ADMIN ══ */
.admin-lock { text-align:center; padding:40px 20px; }
.admin-lock p { color:rgba(255,255,255,.5); margin-bottom:20px; }
.admin-section { margin-bottom:28px; }

.catalog-row {
  background:rgba(255,255,255,.05);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.cr-name { flex:1; font-size:.88rem; font-weight:600; min-width:120px; }
.cr-tag  { font-size:.72rem; color:rgba(255,255,255,.4); background:rgba(255,255,255,.08); padding:2px 10px; border-radius:20px; }

/* ══ OVERLAY ══ */
.overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:200;
  align-items:center;
  justify-content:center;
}
.overlay.open { display:flex; }
.overlay-card {
  background:#2C3A50;
  border-radius:20px;
  padding:28px 24px;
  width:100%;
  max-width:320px;
  text-align:center;
}
.overlay-card h3 { font-family:'Syne',sans-serif; font-size:1.1rem; margin-bottom:6px; }
.overlay-card p  { font-size:.82rem; color:rgba(255,255,255,.5); margin-bottom:18px; }

/* ══ TOAST ══ */
.toast {
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--green);
  color:#fff;
  padding:13px 24px;
  border-radius:14px;
  font-weight:700;
  font-size:.9rem;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:.35s cubic-bezier(.34,1.56,.64,1);
  z-index:999;
  white-space:nowrap;
}
.toast.show { transform:translateX(-50%) translateY(0); }

.btn-export {
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:10px 18px;
  color:#fff;
  font-family:'Nunito',sans-serif;
  font-size:.84rem;
  font-weight:700;
  cursor:pointer;
  margin-right:8px;
  margin-top:8px;
}
.btn-export:hover { background:rgba(255,255,255,.15); }

@media(max-width:600px){
  .form-row { grid-template-columns:1fr; }
  .kpi-grid { grid-template-columns:1fr 1fr; }
}

/* ══ CUMPLIMIENTO ══ */
.res-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:16px; }
.res-card { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:16px; }
.res-tit { font-size:.8rem; color:rgba(255,255,255,.55); font-weight:700; margin-bottom:6px; }
.res-num { font-family:'Syne',sans-serif; font-size:2.1rem; font-weight:800; line-height:1.1; }
.res-sub { font-size:.8rem; color:rgba(255,255,255,.6); margin-top:4px; }
.desv-row { background:rgba(239,68,68,.08); border-left:3px solid var(--red); border-radius:10px; padding:10px 12px; font-size:.84rem; }
.reg-scroll { overflow-x:auto; border-radius:12px; background:rgba(255,255,255,.04); margin-bottom:12px; }
.reg-table { width:100%; border-collapse:collapse; font-size:.8rem; }
.reg-table th { font-size:.72rem; color:rgba(255,255,255,.55); padding:8px; text-align:left; border-bottom:1px solid rgba(255,255,255,.1); }
.reg-table td { padding:7px 8px; border-bottom:1px solid rgba(255,255,255,.05); }
.auto-head { display:flex; flex-direction:column; gap:8px; background:rgba(255,255,255,.05); border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:.84rem; position:sticky; top:58px; z-index:5; backdrop-filter:blur(6px); }
.turno-chip small { opacity:.65; margin-left:4px; }
.item-card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:14px; margin-bottom:14px; }
.item-head { display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; font-size:.95rem; }
.item-pts { font-size:.72rem; color:rgba(255,255,255,.45); font-weight:400; margin-left:4px; }
.cal-chip { font-size:.75rem; font-weight:800; padding:4px 10px; border-radius:20px; }
.q-row { border-top:1px solid rgba(255,255,255,.07); padding:10px 0; }
.q-row.falta { box-shadow:inset 3px 0 0 var(--red); padding-left:10px; }
.q-row.ok { box-shadow:inset 3px 0 0 var(--green); padding-left:10px; }
.q-t { font-size:.86rem; font-weight:600; margin-bottom:6px; }
.crit { color:var(--yellow); }
.q-auto { font-size:.74rem; color:#5eead4; margin-bottom:6px; }
.q-ops { display:flex; flex-wrap:wrap; gap:6px; }
.ans { background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.14); color:#fff; border-radius:10px; padding:8px 12px; font-size:.8rem; cursor:pointer; font-family:'Nunito',sans-serif; }
.ans.sel { background:var(--primary); border-color:var(--primary); font-weight:700; }
.ans:focus-visible, .turno-chip:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.q-v { font-size:.7rem; color:rgba(255,255,255,.35); margin-top:6px; }
.q-hint { font-size:.76rem; margin-top:6px; background:rgba(255,255,255,.05); border-radius:8px; padding:6px 8px; color:rgba(255,255,255,.8); }
.bar-row { display:grid; grid-template-columns:minmax(120px,1.2fr) 2fr 52px; gap:10px; align-items:center; font-size:.8rem; padding:4px 0; }
.bar { height:9px; background:rgba(255,255,255,.08); border-radius:6px; overflow:hidden; } .bar > div { height:100%; }
.acc-card { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-left:4px solid var(--yellow); border-radius:14px; padding:14px; margin-bottom:12px; }
.acc-card.vencida { border-left-color:var(--red); } .acc-card.cerrada { border-left-color:var(--green); opacity:.7; }
.acc-top { display:flex; gap:10px; } .acc-tipo { font-size:1.1rem; }
.acc-t { font-size:.86rem; font-weight:700; } .acc-meta { font-size:.72rem; color:rgba(255,255,255,.45); margin-top:2px; }
.acc-l { font-size:.8rem; color:rgba(255,255,255,.8); margin:6px 0 0; }
.acc-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:10px; }
.acc-grid label, .acc-ev { font-size:.72rem; color:rgba(255,255,255,.5); display:flex; flex-direction:column; gap:4px; }
.acc-ev { margin-top:8px; }
.vf-item { display:grid; grid-template-columns:1fr 90px; gap:8px; align-items:center; font-size:.8rem; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.05); }
.q-grid { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:.8rem; }
.q-grid dt { color:rgba(255,255,255,.45); } .q-grid dd { color:rgba(255,255,255,.85); }
.btn-primary:disabled { opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-logo">🏛️</div>
    <div class="login-title">Mendy <span>Fast Food</span></div>
    <div class="login-sub">Cumplimiento sanitario · San Andrés Islas</div>
    <div class="user-grid" id="user-grid"></div>
    <div class="pin-label">🔐 Ingresa tu PIN (el mismo de Saneamiento)</div>
    <input type="password" class="pin-input" id="pin-input" maxlength="8" placeholder="••••" inputmode="numeric" onkeyup="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="screen-app">
  <div class="top-nav">
    <div class="nav-brand">🏛️ <span>Mendy</span> Cumplimiento</div>
    <div class="nav-user"><span id="nav-user-name"></span><button class="btn-logout" onclick="doLogout()">Salir</button></div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="resumen" onclick="switchTab('resumen',this)">🏠 Resumen</button>
    <button class="tab-btn" data-tab="auto" onclick="switchTab('auto',this)">📝 Autoevaluación</button>
    <button class="tab-btn" data-tab="plan" onclick="switchTab('plan',this)">✅ Plan de acción</button>
    <button class="tab-btn" data-tab="visitas" onclick="switchTab('visitas',this)">🏛️ Visitas</button>
  </div>
  <div class="tab-content active" id="tab-resumen"><div id="resumen-wrap"></div></div>
  <div class="tab-content" id="tab-auto"><div id="auto-wrap"></div></div>
  <div class="tab-content" id="tab-plan"><div id="plan-wrap"></div></div>
  <div class="tab-content" id="tab-visitas"><div id="visitas-wrap"></div></div>
</div>

<div class="toast" id="toast"></div>

<!-- ══ FIREBASE SDK ══ -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxvaYUD4N56iy8n9ATUGQTtpx13ew_Xzk",

// ── utilidades ──
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d=new Date()){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function mesKey(d=new Date()){ return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function mesAnteriorKey(m){ const [y,mo]=m.split('-').map(Number); return mesKey(new Date(y,mo-2,1)); }
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); return isoDate(new Date(y,m-1,d+n)); }
function diasEntre(a,b){ const f=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}; return Math.round((f(b)-f(a))/86400000); }
function diasHasta(iso){ return diasEntre(isoDate(), iso); }
function fechaCO(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fechaCorta(iso){ if(!iso) return ''; const [,m,d]=iso.split('-'); return `${d}/${m}`; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cod(id){ return id.replace('_','.'); }
function itemPorId(id){ return ITEMS.find(i => i.id===id); }
function pregPorId(id){ return PREGUNTAS.find(q => q.id===id); }
function esAdmin(){ return state.currentUser && state.currentUser.role==='admin'; }
function lista(obj){ return Object.values(obj || {}); }
function pesos(n){ return '$' + Math.round(n||0).toLocaleString('es-CO'); }
function showToast(msg,type='ok'){ const t=document.getElementById('toast'); t.textContent=msg;
  t.style.background=type==='ok'?'var(--green)':type==='warn'?'var(--yellow)':'var(--red)'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }

  ['temperaturas','agua_cloro','plagas_inspeccion'].forEach(t => [m, mesAnteriorKey(m)].forEach(mm =>

  CUMP_REF.on('value', s => { const v = s.val() || {};
    state.c = { autoevaluaciones:v.autoevaluaciones||{}, acciones:v.acciones||{}, visitas:v.visitas||{}, borrador:v.borrador||null, mig:v.mig||{} };

}
function refrescar(){

// ══════════════════════════════
//  CALIFICACIÓN (misma regla del instructivo)
// ══════════════════════════════
function respondida(q, v){ return q.r==='multi' ? (v!==undefined && v!==null) : (v!=null && v!==''); }
function evalPregunta(q, v){
  if (q.r==='multi' && v!=null && v!=='na') { const sel = String(v).split(',').filter(x=>x!==''); return sel.length===q.o.length ? 'ok' : 'falta'; }
  if (v==null || v==='') return null;
  if (v==='na') return 'ok';
  if (q.r==='sn') return v==='si' ? 'ok' : 'falta';
  if (q.r==='ns') return v==='no' ? 'ok' : 'falta';
  if (q.r==='tri') return v==='todos' ? 'ok' : 'falta';
  if (q.r==='opt') { const i = Number(String(v).slice(1)); return q.o[i] && q.o[i][1] ? 'ok' : 'falta'; }
  if (q.r==='multi') { const sel = String(v).split(',').filter(x=>x!==''); return sel.length===q.o.length ? 'ok' : 'falta'; }
  return null;
}
// estados: resultado por pregunta ('ok' | 'falta' | 'mit' | null)
function calItem(item, estados){
  const e = item.q.map(q => estados[q.id]);
  if (e.some(x => x==null)) return { cal:null, pts:0 };
  const ok = e.filter(x => x==='ok').length, mit = e.filter(x => x==='mit').length;
  if (ok===e.length) return { cal:'A', pts:item.pts };
  if (ok===0 && mit===0) return { cal:'I', pts:0 };
  return { cal:'AR', pts:item.pts/2 };
}
function estadosDe(resp){ const o={}; PREGUNTAS.forEach(q => o[q.id] = evalPregunta(q, resp[q.id])); return o; }
function estadosConPlan(resp){
  const o = estadosDe(resp);
  const acc = accionesPorPregunta();
  Object.keys(o).forEach(qid => { if (o[qid]==='falta' && acc[qid]) {
    if (acc[qid].estado==='cerrada') o[qid]='ok'; else if (acc[qid].estado==='mitigada') o[qid]='mit'; } });
  return o;
}
function resultado(estados){
  const items = {}; let total = 0, completo = true; const bloques = {};
  ITEMS.forEach(i => { const r = calItem(i, estados); items[i.id] = r; if (!r.cal) completo = false; total += r.pts;
    bloques[i.bloque] = bloques[i.bloque] || { pts:0, max:0 }; bloques[i.bloque].pts += r.pts; bloques[i.bloque].max += i.pts; });
  const criticos = PREGUNTAS.filter(q => q.crit && estados[q.id]==='falta').map(q => q.id);
  const critIna = criticos.filter(qid => items[pregPorId(qid).item].cal==='I');
  const concepto = critIna.length ? 'des' : total>=90 ? 'fav' : total>=60 ? 'req' : 'des';
  return { items, total:Math.round(total*10)/10, completo, bloques, criticos, critIna, concepto };
}
function conceptoTxt(c){ return c==='fav'?'Favorable':c==='req'?'Favorable con requerimientos':'Desfavorable'; }
function conceptoColor(c){ return c==='fav'?'var(--green)':c==='req'?'var(--yellow)':'var(--red)'; }
function calColor(c){ return c==='A'?'var(--green)':c==='AR'?'var(--yellow)':c==='I'?'var(--red)':'rgba(255,255,255,.35)'; }

function dias30(){ const out=[]; for (let i=29;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(isoDate(d)); } return out; }
function keySanea(iso){ const [y,m,d]=iso.split('-').map(Number); return `${d}_${m}_${y}`; }
function regs30(tipo){ const hoy=isoDate(), desde=addDays(hoy,-29); const m=mesKey();
  return [...lista(state.regs[tipo][mesAnteriorKey(m)]), ...lista(state.regs[tipo][m])].filter(r => r.fecha>=desde && r.fecha<=hoy); }
function recep30(){ const hoy=isoDate(), desde=addDays(hoy,-29); const m=mesKey();
  return [...lista(state.evid.recep[mesAnteriorKey(m)]), ...lista(state.evid.recep[m])].filter(r => r.fecha>=desde); }
// Cumplimiento de una práctica diaria sobre los días con datos (mínimo 7 para opinar)
function ratioDias(diasConMarca, primerDia){
  const hoy = isoDate(); const desde = [addDays(hoy,-29), primerDia].filter(Boolean).sort().pop();
  if (!primerDia) return null;
  const ventana = diasEntre(desde, hoy) + 1;
  if (ventana < 7) return null;
  const n = diasConMarca.filter(d => d>=desde && d<=hoy).length;
  return { n, ventana, ok: n/ventana >= 0.8 };
}
function autoTurno(idTarea){
  const ev = state.evid.turnos; if (!ev || !ev.dias) return null;
  const todos = Object.keys(ev.dias).sort(); const primer = todos[0];
  const conMarca = todos.filter(d => ev.dias[d] && ev.dias[d][idTarea]);
  const r = ratioDias(conMarca, primer); if (!r) return { val:null, det:'Turnos aún tiene pocos días de datos' };
  return { val: r.ok?'si':'no', det:`Turnos: cumplida ${r.n} de ${r.ventana} días` };
}
function autoChecklistSanea(filtro){

  const conDatos = dias.filter(d => ct[keySanea(d)]); if (!conDatos.length) return { val:null, det:'Saneamiento aún no tiene checklists registrados' };
  const conMarca = dias.filter(d => filtro(ct[keySanea(d)] || {}));
  const r = ratioDias(conMarca, conDatos[0]); if (!r) return { val:null, det:'Saneamiento aún tiene pocos días de datos' };
  return { val: r.ok?'si':'no', det:`Saneamiento: ${r.n} de ${r.ventana} días` };
}
function certEstado(c){ if (!c || !c.vence) return 'falta'; const d = diasHasta(c.vence); return d<0?'vencido':'vigente'; }
const AUTO = {

  termometro(){ if (!state.san.equipos) return null; const t = state.san.equipos.some(e => /term[oó]metro/i.test(e.name));
    return t ? { val:'si', det:'Saneamiento: hay termómetros en la lista de equipos' } : { val:'no', det:'Saneamiento: no hay termómetros en la lista de equipos' }; },
  certTodos(){ const p = state.evid.personal; if (!p) return null; const act = (p.personas||[]).filter(x=>x.activo); if (!act.length) return null;
    const ok = act.filter(x => certEstado((p.certificados||{})[x.id])==='vigente').length;
    return { val: ok===act.length?'todos':ok?'algunos':'ninguno', det:`Personal: ${ok} de ${act.length} con certificado vigente` }; },

    return { val: (venc||falt)?'no':'si', det: venc||falt ? `Personal: ${venc} vencido${venc===1?'':'s'}, ${falt} sin certificado` : 'Personal: todos vigentes' }; },

  plagasRastro(){ const r = regs30('plagas_inspeccion'); if (!r.length) return null; const h = r.filter(x=>x.hallazgo);

  checklistSanea(){ return autoChecklistSanea(dia => dia.apertura && Object.values(dia.apertura).some(Boolean)); },

function autoTemp(eqId){

function preguntaHtml(q, v, e, auto){

function terminarAutoeval(){
  const b = state.c.borrador; const resp = b.respuestas || {};

  const est = estadosDe(resp);
  const faltan = PREGUNTAS.filter(q => est[q.id]==null);
  if (faltan.length) { showToast(`⚠️ Faltan ${faltan.length} preguntas`,'warn'); return; }
  const r = resultado(est);
  const id = 'ae' + Date.now();
  const ae = { id, ts:Date.now(), fecha:isoDate(), user:state.currentUser.name, respuestas:resp, auto:b.auto||{},
    items:Object.fromEntries(Object.entries(r.items).map(([k,v]) => [k, { cal:v.cal, pts:v.pts }])),
    bloques:r.bloques, total:r.total, concepto:r.concepto, criticos:r.criticos };
  CUMP_REF.child('autoevaluaciones/'+id).set(ae);
  // Cada faltante pasa al plan de acción (sin duplicar las que ya están abiertas)
  const abiertas = accionesPorPregunta(); let nuevas = 0;
  PREGUNTAS.filter(q => est[q.id]==='falta').forEach(q => {
    const ya = abiertas[q.id]; if (ya && ya.estado!=='cerrada') return;
    crearAccion({ origen:'autoevaluacion', autoevalId:id, preguntaId:q.id, item:q.item, m:q.m, mit:q.mit||null, def:q.def, v:q.v||'',
      crit:!!q.crit, fecha: addDays(isoDate(), q.m==='🔴' ? 15 : 30) }); nuevas++; });
  CUMP_REF.child('borrador').set(null);
  state.verAutoeval = id; state.c.autoevaluaciones[id] = ae; state.c.borrador = null;
  showToast(`✅ Autoevaluación guardada: ${r.total} %. ${nuevas} ${nuevas===1?'acción nueva':'acciones nuevas'} en el plan.`);
  renderAuto();
}

    ITEMS.map(i => { const r = ae.items[i.id]||{}; return `<tr><td>${cod(i.id)} ${esc(i.nombre)}</td><td style="color:${calColor(r.cal)};font-weight:800">${r.cal||'—'}</td><td>${String(r.pts||0).replace('.',',')} / ${i.pts}</td></tr>`; }).join('') + `</table></div>` +
    `<p class="section-title" style="margin-top:16px;">Lo que falta, primero lo que más suma (${faltantes.length})</p>` +
    (faltantes.length ? faltantes.map(({q,item}) => `<div class="hist-row" style="border-left:3px solid ${q.m==='🔴'?'var(--red)':'var(--yellow)'}"><div>
      <div class="hr-name">${q.crit?'⚠ ':''}${cod(item.id)} · ${esc(q.t)}</div>
      <div class="hr-meta">${q.m==='🟡'?`🟡 Mientras tanto: ${esc(q.mit)} · Definitivo: ${esc(q.def)}`:`🔴 ${esc(q.def)}`}</div>
      <div class="hr-meta">Se verifica en: ${esc(q.v||'')}</div></div></div>`).join('') : '<p style="font-size:.85rem;color:var(--green)">✅ No falta nada.</p>');
}

// ══════════════════════════════
//  PLAN DE ACCIÓN
// ══════════════════════════════
function renderAcciones(){
  const todas = lista(state.c.acciones).filter(a => a.estado!=='descartada');
  const f = state.filtroAcc;
  const sel = todas.filter(a => f==='todas' ? true : f==='cerradas' ? a.estado==='cerrada' : f==='vencidas' ? accionVencida(a) : a.estado!=='cerrada')
    .sort((a,b) => ((a.estado==='cerrada') - (b.estado==='cerrada')) || ((a.fecha||'9') < (b.fecha||'9') ? -1 : 1));
  const abiertas = todas.filter(a => a.estado!=='cerrada');
  const costo = abiertas.reduce((t,a)=>t+(Number(a.costo)||0),0);
  const chip = (k,l) => `<span class="turno-chip ${f===k?'active':''}" onclick="state.filtroAcc='${k}';renderAcciones()">${l}</span>`;
  document.getElementById('plan-wrap').innerHTML =
    `<div class="turno-tabs">${chip('abiertas',`Abiertas (${abiertas.length})`)}${chip('vencidas',`Vencidas (${todas.filter(accionVencida).length})`)}${chip('cerradas','Cerradas')}${chip('todas','Todas')}</div>
    ${costo ? `<p style="font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:12px;">💰 Costo estimado de lo pendiente: <b>${pesos(costo)}</b>. Prográmalo en la Alcancía de Provisión del módulo de Finanzas.</p>` : ''}` +
    (sel.length ? sel.map(accionHtml).join('') : '<p style="font-size:.85rem;color:rgba(255,255,255,.45)">No hay acciones en este filtro.</p>');
}
function accionHtml(a){
  const it = itemPorId(a.item) || { nombre:'' }; const dis = esAdmin() ? '' : 'disabled';
  const origen = a.origen==='visita' ? `Hallazgo de la visita del ${fechaCO((state.c.visitas[a.visitaId]||{}).fecha)}` : `Autoevaluación del ${fechaCO((state.c.autoevaluaciones[a.autoevalId]||{}).fecha)}`;
  const vencida = accionVencida(a);
  const estados = [['pendiente','Pendiente'],['proceso','En proceso'],...(a.m==='🟡'?[['mitigada','Mitigada (medida temporal)']]:[]),['cerrada','Cerrada']];
  return `<div class="acc-card ${a.estado==='cerrada'?'cerrada':vencida?'vencida':''}">
    <div class="acc-top"><span class="acc-tipo">${a.m||'🔴'}</span><div style="flex:1">
      <div class="acc-t">${a.crit?'⚠ ':''}${cod(a.item)} ${esc(it.nombre)} · ${esc(textoAccion(a))}</div>
      <div class="acc-meta">${origen}${a.v?' · se verifica en '+esc(a.v):''}</div></div></div>
    ${a.mit ? `<p class="acc-l">🟡 <b>Mientras tanto:</b> ${esc(a.mit)}</p>` : ''}
    <p class="acc-l">${a.m==='🟡'?'<b>Definitivo:</b>':'🔴 <b>Hacer:</b>'} ${esc(a.def||'')}</p>
    <div class="acc-grid">
      <label>Responsable<input class="form-input" value="${esc(a.responsable||'')}" ${dis} onchange="actualizarAccion('${a.id}','responsable',this.value)"></label>
      <label>Fecha límite<input class="form-input" type="date" value="${a.fecha||''}" ${dis} onchange="actualizarAccion('${a.id}','fecha',this.value)" style="${vencida?'border-color:var(--red)':''}"></label>
      <label>Costo estimado (COP)<input class="form-input" type="number" min="0" step="1000" value="${a.costo||''}" ${dis} onchange="actualizarAccion('${a.id}','costo',this.value?Number(this.value):null)"></label>
      <label>Estado<select class="form-select" ${dis} onchange="cambiarEstado('${a.id}',this.value)">${estados.map(([k,l])=>`<option value="${k}" ${a.estado===k?'selected':''}>${l}</option>`).join('')}</select></label>
    </div>
    <label class="acc-ev">Evidencia (qué se hizo o enlace al soporte)<input class="form-input" value="${esc(a.evidencia||'')}" ${dis} placeholder="Ej: registrado en Saneamiento el 12/10, certificado en Drive" onchange="actualizarAccion('${a.id}','evidencia',this.value)"></label>
    ${a.cerrado ? `<p class="acc-meta">Cerrada el ${fechaCO(a.cerrado)} por ${esc(a.cerradoPor||'')}</p>` : ''}</div>`;
}
function actualizarAccion(id, campo, valor){ if (!esAdmin()) return; CUMP_REF.child(`acciones/${id}/${campo}`).set(valor===''?null:valor); state.c.acciones[id][campo]=valor; showToast('✅ Guardado'); }
function cambiarEstado(id, estado){
  if (!esAdmin()) return; const a = state.c.acciones[id];
  if (estado==='cerrada' && !(a.evidencia||'').trim()) { showToast('⚠️ Escribe primero la evidencia de cierre','warn'); renderAcciones(); return; }
  const upd = { estado, cerrado: estado==='cerrada' ? isoDate() : null, cerradoPor: estado==='cerrada' ? state.currentUser.name : null };
  CUMP_REF.child('acciones/'+id).update(upd); Object.assign(a, upd);
  showToast(estado==='cerrada' ? '✅ Acción cerrada' : '✅ Estado actualizado'); renderAcciones();
}

// ══════════════════════════════
//  VISITAS
// ══════════════════════════════
const MOTIVOS = ['Programación','Solicitud del interesado','Peticiones, quejas y reclamos','Solicitud oficial','Evento de interés en salud pública','Otro'];
function renderVisitas(){
  const wrap = document.getElementById('visitas-wrap');
  if (state.visitaForm) { wrap.innerHTML = formVisitaHtml(); return; }
  const vs = visitasOrdenadas().reverse(); const uv = vs[0];
  let html = uv ? `<div class="form-card" style="border-left:4px solid var(--accent)"><h3>📋 Para el encabezado de la próxima acta</h3>
    <p style="font-size:.84rem;line-height:1.7">Concepto sanitario de la última visita: <b>${conceptoTxt(uv.concepto)}</b><br>Fecha de la última inspección: <b>${fechaCO(uv.fecha)}</b><br>% de cumplimiento de la última inspección: <b>${uv.pct!=null?uv.pct+' %':'—'}</b></p></div>` : '';
  if (esAdmin()) html += `<button class="btn-primary" style="margin-bottom:14px" onclick="state.visitaForm=true;renderVisitas()">➕ Registrar visita</button>`;
  html += vs.length ? vs.map(v => visitaHtml(v, state.visitaAbierta===v.id)).join('') : '<p style="font-size:.85rem;color:rgba(255,255,255,.45)">Sin visitas registradas.</p>';
  wrap.innerHTML = html;
}
function visitaHtml(v, abierta){
  const acc = lista(state.c.acciones).filter(a => a.visitaId===v.id);
  const cab = `<div class="hist-row" style="cursor:pointer" onclick="state.visitaAbierta=${abierta?'null':`'${v.id}'`};renderVisitas()"><div>
    <div class="hr-name">🏛️ ${fechaCO(v.fecha)} · ${v.pct!=null?v.pct+' % · ':''}${conceptoTxt(v.concepto)}</div>
    <div class="hr-meta">${esc(v.entidad||'')} · ${acc.filter(a=>a.estado!=='cerrada').length} de ${acc.length} hallazgos abiertos</div></div>
    <span style="font-size:.8rem">${abierta?'▴':'▾'}</span></div>`;
  if (!abierta) return cab;
  const items = Object.entries(v.items||{});
  return cab + `<div class="form-card" style="margin-top:-6px">
    ${v.nota ? `<p class="acc-meta" style="margin-bottom:8px">ℹ️ ${esc(v.nota)}</p>` : ''}
    <dl class="q-grid"><dt>Entidad</dt><dd>${esc(v.entidad||'')}</dd>${v.motivo?`<dt>Motivo</dt><dd>${esc(v.motivo)}</dd>`:''}
      <dt>Funcionarios</dt><dd>${(v.funcionarios||[]).filter(f=>f.nombre).map(f=>`${esc(f.nombre)} (${esc(f.cargo)})`).join(' · ')}</dd>
      <dt>Atendió</dt><dd>${v.atendio?`${esc(v.atendio.nombre)} (${esc(v.atendio.cargo)})`:''}</dd>
      <dt>Medida sanitaria</dt><dd>${v.medida?'Sí':'No'}</dd>
      ${v.obsAutoridad?`<dt>Observación autoridad</dt><dd>${esc(v.obsAutoridad)}</dd>`:''}
      ${v.obsEstablecimiento?`<dt>Observación establecimiento</dt><dd>${esc(v.obsEstablecimiento)}</dd>`:''}
      ${v.foto?`<dt>Acta</dt><dd><a href="${esc(v.foto)}" target="_blank" rel="noopener" style="color:var(--blue)">📷 Ver foto del acta</a></dd>`:''}</dl>
    ${items.length ? `<p class="section-title" style="margin-top:12px">Calificación por ítem</p><div class="reg-scroll"><table class="reg-table"><tr><th>Ítem</th><th>Cal.</th><th>Hallazgo</th><th>Acción</th></tr>
      ${items.sort().map(([k,c]) => { const a = acc.find(x=>x.item===k); return `<tr><td>${cod(k)} ${esc((itemPorId(k)||{}).nombre||'')}</td><td style="color:${calColor(c)};font-weight:800">${c}</td>
        <td style="white-space:normal;text-align:left">${esc((v.hallazgos||{})[k]||'')}</td><td>${a?(a.estado==='cerrada'?'✅ Cerrada':'⏳ '+a.estado):''}</td></tr>`; }).join('')}</table></div>` : ''}</div>`;
}
function formVisitaHtml(){
  const opcCal = ['','A','AR','I','NA'];
  return `<div class="form-card"><h3>🏛️ Registrar visita de la Secretaría</h3>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Fecha</label><input class="form-input" type="date" id="vf-fecha" value="${isoDate()}" max="${isoDate()}"></div>
      <div class="form-group"><label class="form-label">Entidad</label><input class="form-input" id="vf-entidad" value="Secretaría de Salud Departamental"></div></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Motivo</label><select class="form-select" id="vf-motivo">${MOTIVOS.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">¿Aplicaron medida sanitaria de seguridad?</label><select class="form-select" id="vf-medida"><option value="no">No</option><option value="si">Sí</option></select></div></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Funcionario 1 (nombre y cargo)</label><input class="form-input" id="vf-f1n" placeholder="Nombre"><input class="form-input" id="vf-f1c" placeholder="Cargo" style="margin-top:6px"></div>
      <div class="form-group"><label class="form-label">Funcionario 2 (opcional)</label><input class="form-input" id="vf-f2n" placeholder="Nombre"><input class="form-input" id="vf-f2c" placeholder="Cargo" style="margin-top:6px"></div></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Quién atendió (nombre y cargo)</label><input class="form-input" id="vf-an" placeholder="Nombre"><input class="form-input" id="vf-ac" placeholder="Cargo" style="margin-top:6px"></div>
      <div class="form-group"><label class="form-label">% de cumplimiento del acta</label><input class="form-input" type="number" id="vf-pct" min="0" max="100" step="0.5">
        <label class="form-label" style="margin-top:8px">Concepto</label><select class="form-select" id="vf-concepto"><option value="fav">Favorable</option><option value="req" selected>Favorable con requerimientos</option><option value="des">Desfavorable</option></select></div></div>
    <p class="acc-meta" style="margin:8px 0">No se guardan cédulas: nombre y cargo bastan.</p>
    <p class="section-title">Calificación por ítem (lo que diga el acta; en blanco si no aparece)</p>
    ${ITEMS.map(i => `<div class="vf-item"><span>${cod(i.id)} ${esc(i.nombre)}</span>
      <select class="form-select" id="vf-cal-${i.id}" onchange="document.getElementById('vf-h-${i.id}').style.display=['AR','I'].includes(this.value)?'block':'none'">${opcCal.map(c=>`<option value="${c}">${c||'—'}</option>`).join('')}</select>
      <textarea class="form-input" id="vf-h-${i.id}" style="display:none;grid-column:1/-1;min-height:50px" placeholder="Hallazgo que escribió el inspector"></textarea></div>`).join('')}
    <div class="form-group" style="margin-top:12px"><label class="form-label">Observación de la autoridad</label><input class="form-input" id="vf-oa"></div>
    <div class="form-group"><label class="form-label">Observación del establecimiento</label><input class="form-input" id="vf-oe"></div>
    <div class="form-group"><label class="form-label">Enlace a la foto del acta (Drive)</label><input class="form-input" id="vf-foto" placeholder="https://…"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn-primary" onclick="guardarVisita()">💾 Guardar visita</button><button class="btn-export" onclick="state.visitaForm=false;renderVisitas()">Cancelar</button></div></div>`;
}
function guardarVisita(){
  const g = id => document.getElementById(id).value.trim();
  const fecha = g('vf-fecha'); if (!fecha) { showToast('⚠️ Escribe la fecha','warn'); return; }
  const foto = g('vf-foto'); if (foto && !/^https:\/\//i.test(foto)) { showToast('⚠️ El enlace debe empezar por https://','warn'); return; }
  const items = {}, hallazgos = {};
  ITEMS.forEach(i => { const c = g('vf-cal-'+i.id); if (c) items[i.id] = c; const h = g('vf-h-'+i.id); if (h && ['AR','I'].includes(c)) hallazgos[i.id] = h; });
  const sinTexto = Object.entries(items).filter(([k,c]) => ['AR','I'].includes(c) && !hallazgos[k]);
  if (sinTexto.length) { showToast(`⚠️ Escribe el hallazgo de ${sinTexto.map(([k])=>cod(k)).join(', ')}`,'warn'); return; }
  const pct = g('vf-pct');
  const v = { id:'v'+fecha.replace(/-/g,'')+'_'+Date.now().toString().slice(-4), fecha, entidad:g('vf-entidad'), motivo:g('vf-motivo'), medida:g('vf-medida')==='si',
    funcionarios:[{nombre:g('vf-f1n'),cargo:g('vf-f1c')},{nombre:g('vf-f2n'),cargo:g('vf-f2c')}].filter(f=>f.nombre),
    atendio: g('vf-an') ? { nombre:g('vf-an'), cargo:g('vf-ac') } : null, pct: pct===''?null:Number(pct), concepto:g('vf-concepto'),
    items, hallazgos, obsAutoridad:g('vf-oa'), obsEstablecimiento:g('vf-oe'), foto:foto||null, creado:Date.now(), creadoPor:state.currentUser.name };
  CUMP_REF.child('visitas/'+v.id).set(v);
  Object.entries(hallazgos).forEach(([item, txt]) => crearAccion({ origen:'visita', visitaId:v.id, item, texto:txt, m:'🔴', def:'Corregir el hallazgo y dejar evidencia', fecha:addDays(fecha, 30) }));
  state.visitaForm = false; state.visitaAbierta = v.id;
  showToast(`✅ Visita guardada. ${Object.keys(hallazgos).length} hallazgo(s) pasaron al plan de acción.`);
  setTimeout(renderVisitas, 50);
}

// ══════════════════════════════
//  INICIO
// ══════════════════════════════
init();
renderUserGrid();
</script>
</body>
</html>
